[workspace]
resolver = "3"
members = [
  "crates/contracts",
  "crates/journal",
  "crates/surfaces-macos",
  "crates/surfaces",
  "crates/provider-claude",
  "crates/relay",
  "apps/agent-macos/core",
  "apps/desktop/src-tauri",
  "tests/native/qualify",
]
exclude = ["third_party"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "UNLICENSED"

[workspace.dependencies]
# Tauri 3 qualification candidate (SPEC §18.1). Exact pins; never float.
tauri = { version = "=3.0.0-alpha.4", default-features = false, features = ["compression"] }
tauri-runtime-wry = "=3.0.0-alpha.4"
tauri-build = "=3.0.0-alpha.3"

# SQLite 3.53.4 through the patched binding (docs/decisions/D-0001).
rusqlite = { version = "=0.40.2", features = ["bundled"] }

objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
libc = "0.2.190"
sha2 = "0.11.0"
ts-rs = { version = "12.0.1", features = ["serde-json-impl", "no-serde-warnings"] }
tokio = { version = "1.53.2", default-features = false, features = ["sync", "time"] }

threadspace-contracts = { path = "crates/contracts" }
threadspace-journal = { path = "crates/journal" }
threadspace-relay = { path = "crates/relay" }
threadspace-surfaces-macos = { path = "crates/surfaces-macos" }
threadspace-surfaces = { path = "crates/surfaces" }
threadspace-provider-claude = { path = "crates/provider-claude" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[patch.crates-io]
libsqlite3-sys = { path = "third_party/libsqlite3-sys" }
