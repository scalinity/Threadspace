[package]
name = "threadspace-desktop"
description = "Threadspace.app: Tauri 3 shell, outer ServiceManagement bootstrap and the renderer bridge."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "threadspace_desktop"
path = "src/lib.rs"

[[bin]]
name = "threadspace-desktop"
path = "src/main.rs"

[features]
# Qualification builds record renderer/IPC reports and can open the ACL probe
# view. Release builds (M15) are built without it.
qualification = ["threadspace-contracts/qualification"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-runtime-wry.workspace = true
threadspace-contracts.workspace = true
threadspace-relay.workspace = true
threadspace-surfaces-macos.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tokio.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-service-management.workspace = true

[dev-dependencies]
tauri = { workspace = true, features = ["test"] }

[lints]
workspace = true
